name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check web remote syntax
        run: node --check tv/src/main/assets/web/app.js
      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report build errors
        if: failure()
        run: .github/scripts/report-errors.sh build.log
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            tv/build/outputs/apk/debug/*.apk
            remote/build/outputs/apk/debug/*.apk
          retention-days: 7
