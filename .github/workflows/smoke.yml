name: Smoke test

# Installs the debug APKs on an Android TV emulator and a phone emulator, drives them a little,
# fails on crashes, and pushes screenshots to the ci-screenshots branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tv/**", "remote/**", "shared/**", ".github/workflows/smoke.yml"]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tv
            target: android-tv
            api: 33
            arch: x86
            profile: tv_1080p
          - name: phone
            target: google_apis
            api: 34
            arch: x86_64
            profile: pixel_7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke-${{ matrix.name }}.sh
      - name: Report crashes
        if: always()
        run: |
          if [ -f shots/crash.txt ]; then
            while IFS= read -r line; do echo "::error title=crash::${line//'%'/'%25'}"; done < <(head -n 40 shots/crash.txt)
          fi
      - name: Publish screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name "hearth-ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-screenshots || true
          mkdir -p /tmp/pub && cp -r shots /tmp/pub/${{ matrix.name }}
          git checkout --orphan pub-tmp && git rm -rf . -q
          if git rev-parse -q --verify origin/ci-screenshots >/dev/null; then git checkout origin/ci-screenshots -- . 2>/dev/null || true; fi
          rm -rf ${{ matrix.name }} && cp -r /tmp/pub/${{ matrix.name }} ${{ matrix.name }}
          git add ${{ matrix.name }} && git commit -qm "Screenshots ${{ matrix.name }} @ ${GITHUB_SHA::7}" || exit 0
          for i in 1 2 3; do git push -f origin HEAD:ci-screenshots-${{ matrix.name }} && break; sleep 5; done
